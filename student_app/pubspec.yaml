name: student_app
description: "Mothakira - past exam papers and practice for Sudanese secondary students."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State, routing, network
  provider: ^6.1.2
  go_router: ^14.6.2
  dio: ^5.7.0

  # Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3
  drift: ^2.20.3
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.5
  path: ^1.9.0

  # Localisation
  intl: ^0.20.2

  # Files, media, receipts
  image_picker: ^1.1.2
  file_picker: ^8.1.4
  flutter_image_compress: ^2.3.0
  mime: ^2.0.0

  # Platform utilities
  connectivity_plus: ^6.1.0
  url_launcher: ^6.3.1
  share_plus: ^10.1.2
  flutter_svg: ^2.0.16
  encrypt: ^5.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4
  drift_dev: ^2.20.3
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/fixtures/
    - assets/images/
  fonts:
    - family: Naskh
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700
    - family: PlexArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700